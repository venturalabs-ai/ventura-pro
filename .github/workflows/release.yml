name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate SemVer tag and VERSION
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          VERSION=$(tr -d '[:space:]' < VERSION)
          test "$TAG" = "v$VERSION"
      - name: Run eval gate
        run: python scripts/run_evals.py
      - name: Validate provenance
        run: test -f PROVENANCE.md
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.24.1
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Build source artifact and checksums
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix=ventura-pro-${GITHUB_REF_NAME}/ -o ventura-pro-${GITHUB_REF_NAME}.tar.gz HEAD
          sha256sum ventura-pro-${GITHUB_REF_NAME}.tar.gz sbom.spdx.json > SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: |
            ventura-pro-${{ github.ref_name }}.tar.gz
            sbom.spdx.json
            SHA256SUMS
