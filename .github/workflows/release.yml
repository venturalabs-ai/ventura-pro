name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate SemVer tag and VERSION
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid SemVer tag: $TAG" >&2
            exit 1
          fi
          VERSION=$(tr -d '[:space:]' < VERSION)
          test "$TAG" = "v$VERSION" || { echo "Tag $TAG does not match VERSION $VERSION" >&2; exit 1; }
      - name: Run eval gate before release
        run: python scripts/run_evals.py
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
