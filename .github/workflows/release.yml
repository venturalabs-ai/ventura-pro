name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate SemVer tag and VERSION
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          VERSION=$(tr -d '[:space:]' < VERSION)
          test "$TAG" = "v$VERSION"
      - name: Run eval gate
        run: python scripts/run_evals.py
      - name: Validate provenance
        run: test -f PROVENANCE.md
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Build source artifact and checksums
        shell: bash
        run: |
          git archive --format=tar.gz --prefix=ventura-pro-${GITHUB_REF_NAME}/ -o ventura-pro-${GITHUB_REF_NAME}.tar.gz HEAD
          sha256sum ventura-pro-${GITHUB_REF_NAME}.tar.gz sbom.spdx.json > SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ventura-pro-${{ github.ref_name }}.tar.gz
            sbom.spdx.json
            SHA256SUMS
